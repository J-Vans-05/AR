<title>اسکن نماد</title>
<style>
  :root{
    --accent: #FFB020;
    --text: #ECE9DC;
  }
  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;

  }

    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }

    object-fit: cover;
  }
  #hint{
    position: fixed;
    left: 50%;
    bottom: 78px;

    background: rgba(20,21,15,0.72);

    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-inline-start: 6px;
    box-shadow: 0 0 6px var(--accent);
  }
  #err{
    position: fixed;
    inset: 0;
    z-index: 20;
    background: #14150F;
    color: #ECE9DC;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    font-size: 14px;
    line-height: 2;
  }
  #zoomControls{
    position: fixed;
    right: 16px;
    bottom: 100px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #zoomControls button{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(20,21,15,0.72);
    color: #ECE9DC;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #zoomControls button:active{
    background: rgba(255,176,32,0.28);
  }
  #nameTag{
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    z-index: 12;
    text-align: center;
    pointer-events: none;
  }
  #nameTagShort{
    font-size: 15px;
    font-weight: 600;
    color: #ECE9DC;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  #nameTagFull{
    font-size: 11px;
    color: #B8B6A6;
    margin-top: 2px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
</style>
</head>

const hint = document.getElementById('hint');
const errBox = document.getElementById('err');

function showFatal(msg) {
  errBox.style.display = "flex";
  errBox.innerHTML = "خطا:<br>" + String(msg).slice(0, 200);
}
window.addEventListener('error', (e) => showFatal(e.message));
window.addEventListener('unhandledrejection', (e) => showFatal(e.reason));

const mindarThree = new MindARThree({
  container: document.querySelector("#container"),
  imageTargetSrc: "./targets.mind",
});

const { renderer, scene, camera } = mindarThree;

// Colour-managed lighting for a bright logo with visible 3D form.
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;

scene.add(new THREE.AmbientLight(0xffffff, 1.15));
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8068, 1.65));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.1);
keyLight.position.set(1.5, 2.5, 2.0);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffe2b0, 0.8);
fillLight.position.set(-1.5, 0.7, 1.2);
scene.add(fillLight);

const anchor = mindarThree.addAnchor(0);
let model = null;

// base scale tuned so the model reads as roughly marker-sized, not overflowing the screen
const BASE_SCALE = 0.003;
let currentScale = BASE_SCALE;
const BASE_TILT = Math.PI / 2; // standing upright off the marker plane

new GLTFLoader().load(MODEL_DATA_URI, (gltf) => {
  model = gltf.scene;
  model.scale.set(BASE_SCALE, BASE_SCALE, BASE_SCALE);
  model.rotation.x = BASE_TILT; // flip the sign here if it appears lying flat/backwards
  anchor.group.add(model);
});

anchor.onTargetFound = () => {
  hint.style.opacity = "0";
};
anchor.onTargetLost = () => {
  hint.style.opacity = "1";
};

// --- controls: one-finger drag rotates in any direction; +/- buttons resize ---
let autoRotate = true;
let lastSingle = null;

const stage = document.querySelector('#container');
stage.style.touchAction = 'none';

stage.addEventListener('pointerdown', (e) => {
  autoRotate = false;
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  lastSingle = { x: e.clientX, y: e.clientY };
});

stage.addEventListener('pointermove', (e) => {
  if (!lastSingle || !model) return;
  const dx = e.clientX - lastSingle.x;
  const dy = e.clientY - lastSingle.y;
  model.rotation.y += dx * 0.012;
  model.rotation.x = Math.max(BASE_TILT - 1.3, Math.min(BASE_TILT + 1.3, model.rotation.x + dy * 0.012));
  lastSingle = { x: e.clientX, y: e.clientY };
});

function releasePointer() { lastSingle = null; }
stage.addEventListener('pointerup', releasePointer);
stage.addEventListener('pointercancel', releasePointer);

// explicit zoom buttons - guaranteed to work even where pinch-over-camera gestures don't
const ZOOM_STEP = 1.18;
const ZOOM_MIN = BASE_SCALE * 0.25;
const ZOOM_MAX = BASE_SCALE * 12;

function applyZoom(factor) {
  if (!model) return;
  autoRotate = false;
  currentScale = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, currentScale * factor));
  model.scale.set(currentScale, currentScale, currentScale);
}

document.getElementById('zoomIn').addEventListener('click', () => applyZoom(ZOOM_STEP));
document.getElementById('zoomOut').addEventListener('click', () => applyZoom(1 / ZOOM_STEP));

async function start() {
  try {
    await mindarThree.start();
    renderer.setAnimationLoop(() => {
      if (model && autoRotate) {
        model.rotation.y += 0.01; // idle spin until the user touches the model
      }
      renderer.render(scene, camera);
    });
  } catch (e) {
    showFatal(e.message || e);
    console.error(e);
  }
}
start();
